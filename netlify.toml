[build]
  command = "npm run build"
  publish = "."

# Netlify serves the Next.js SSR app. API routes are proxied to the Supabase
# Edge Function `api`. Set SUPABASE_PROJECT_URL in the Netlify site environment
# before deploying (e.g. SUPABASE_PROJECT_URL=abcdefghij.supabase.co).

[[redirects]]
  from = "/api/*"
  to = "https://{{SUPABASE_PROJECT_URL}}/functions/v1/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Webhook URL (must be set in your Muapi dashboard for the project)
# https://muapi.ai/dashboard -> webhooks -> https://<your-domain>/api/webhooks/muapi
