# Netlify Functions directory
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route each Netlify Function endpoint
[[redirects]]
  from = "/functions/v1/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/images/*"
  to = "/.netlify/functions/images"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/jobs/*"
  to = "/.netlify/functions/jobs"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/leads/*"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/videos/*"
  to = "/.netlify/functions/videos"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/webhooks/muapi"
  to = "/.netlify/functions/ai-orchestrator"
  status = 200
  force = true

[[redirects]]
  from = "/functions/v1/webhooks/muapi/*"
  to = "/.netlify/functions/ai-orchestrator"
  status = 200
  force = true

# Next.js app routing
[build]
  command = "yarn build"
  publish = ".next"

[dev]
  command = "next dev"
  # Note: do NOT set `port` here. Netlify's framework detector already
  # detects Next.js on port 3000. Setting port = 3000 explicitly triggers
  # "The 'port' option you specified conflicts with the port of your application".

