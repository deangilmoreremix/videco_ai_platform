# Next.js app on Netlify (API routes run as Netlify functions automatically).
#
# The old netlify/functions/* duplicates of the Supabase backend were removed:
# they used the service-role key and trusted a caller-supplied x-tenant-id
# header, so anyone could read or write any tenant's data. The browser talks
# to the Supabase `api` Edge Function (src/services/index.ts).

[build]
  command = "yarn build"
  publish = ".next"

[dev]
  command = "next dev"
  # Note: do NOT set `port` here. Netlify's framework detector already
  # detects Next.js on port 3000. Setting port = 3000 explicitly triggers
  # "The 'port' option you specified conflicts with the port of your application".
